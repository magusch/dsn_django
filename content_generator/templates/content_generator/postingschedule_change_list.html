{% extends "admin/change_list.html" %}

{% block extrahead %}
    {{ block.super }}
    {% include "content_generator/partials/tg_post_card_css.html" %}
    <style>
        /* Post preview column — wide enough to read, scrollable instead of endless rows */
        #result_list td.field-post_preview { width: 400px; min-width: 340px; vertical-align: top; padding: 8px; }
        #result_list td.field-post_preview .tg-post-cell { position: relative; }
        #result_list td.field-post_preview .tg-post-card {
            max-height: 320px; overflow-y: auto; margin: 0;
        }
        #result_list td.field-post_preview .tg-post-cell.expanded .tg-post-card { max-height: none; }
        .tg-post-toggle {
            display: inline-block; margin-top: 4px; font-size: 11px; color: #417690;
            background: none; border: none; padding: 0; cursor: pointer;
        }
        .tg-post-toggle:hover { text-decoration: underline; }
        #result_list td, #result_list th { vertical-align: top; }
        #result_list tbody tr { border-bottom: 1px solid #eee; }
    </style>
    <script>
    (function() {
        function init() {
            document.querySelectorAll('.tg-post-toggle').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var cell = btn.closest('.tg-post-cell');
                    if (!cell) return;
                    var expanded = cell.classList.toggle('expanded');
                    btn.textContent = expanded ? 'Свернуть' : 'Развернуть';
                });
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
{% endblock %}
